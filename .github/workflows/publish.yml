name: Publish to NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node tests/run-all.js

      - name: Bump version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "Tag v$CURRENT_VERSION already exists, skipping bump"
          elif npm view "$PACKAGE_NAME@$CURRENT_VERSION" version 2>/dev/null; then
            NEXT_VERSION=$(node -p "
              const v = '$CURRENT_VERSION'.split('.');
              v[2] = parseInt(v[2]) + 1;
              v.join('.');
            ")
            
            if git rev-parse "v$NEXT_VERSION" >/dev/null 2>&1; then
              echo "Next version v$NEXT_VERSION already tagged, updating package.json without creating tag"
              npm version $NEXT_VERSION --no-git-tag-version
            else
              echo "Version $CURRENT_VERSION already published, bumping to $NEXT_VERSION"
              npm version patch -m "chore: bump version to %s [skip ci]"
            fi
          else
            echo "Bumping new version"
            npm version patch -m "chore: bump version to %s [skip ci]"
          fi

      - name: Push changes
        run: git push --follow-tags

      - name: Publish to NPM
        run: npm publish --access public
